<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SwiftCourier - Branch Management</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Standard Navigation Bar -->
  <nav class="navbar">
    <a href="index.html" class="logo"><i class="fas fa-building"></i> Branch Portal</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="tracking.html">Track Parcel</a></li>
      <li><a href="booking.html">Book Parcel</a></li>
      <!-- FIXED: Smart Dashboard Link added -->
      <li><a href="#" class="active" onclick="routeToDashboard(event)">Dashboards</a></li>
    </ul>
    <div class="nav-btns">
      <button class="theme-toggle" onclick="SwiftCourier.toggleTheme()"><i class="fas fa-moon"></i></button>
      <!-- FIXED: Wired the logout button to the function -->
      <a href="#" onclick="logoutUser()" class="btn btn-primary">Logout</a>
    </div>
  </nav>

  <div class="dashboard-container" style="max-width: 1200px; margin: 20px auto; padding: 0 20px;">
    <main class="main-content" style="width: 100%;">
      
      <div class="stats-grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));">
        <div class="stat-card glass">
          <div class="stat-icon" style="background: rgba(245, 124, 0, 0.2); color: #f57c00;"><i class="fas fa-boxes-packing"></i></div>
          <div class="stat-info"><h3 id="branchPending">0</h3><p>Pending Dispatch</p></div>
        </div>
        <div class="stat-card glass">
          <div class="stat-icon" style="background: rgba(21, 101, 192, 0.2); color: #1565C0;"><i class="fas fa-truck-fast"></i></div>
          <div class="stat-info"><h3 id="branchTransit">0</h3><p>In Transit</p></div>
        </div>
      </div>

      <h2 style="margin-top: 30px;"><i class="fas fa-clipboard-list"></i> Branch Operations Queue</h2>
      <div class="glass table-responsive" style="margin-top:15px; padding:20px;">
        <table class="custom-table">
          <thead>
            <tr>
              <th>Tracking ID</th>
              <th>Destination</th>
              <th>Weight</th>
              <th>Current Status</th>
              <th>Update Location</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="branchTableBody">
            <!-- Data injected via JS -->
          </tbody>
        </table>
      </div>

    </main>
  </div>

  <script src="js/app.js"></script>
  <script>
    // FIXED: Smart Routing Logic
    function routeToDashboard(event) {
      event.preventDefault(); 
      const role = localStorage.getItem('userRole');
      if (role === 'admin') window.location.href = 'admin.html';
      else if (role === 'branch') window.location.href = 'branch.html';
      else if (role === 'agent') window.location.href = 'delivery.html';
      else if (role === 'customer') window.location.href = 'customer.html';
      else window.location.href = 'login.html';
    }

    // FIXED: Logout function
    function logoutUser() {
      localStorage.removeItem('authToken');
      localStorage.removeItem('userRole');
      window.location.href = 'login.html';
    }

    // FIXED: Secured Fetch Logic
    async function loadBranchData() {
      try {
        const token = localStorage.getItem('authToken');
        
        // Kick them out if not logged in
        if (!token) {
          window.location.href = 'login.html';
          return;
        }

        const response = await fetch('http://localhost:3000/api/bookings/all', {
          method: 'GET',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}` // Provide the VIP pass
          }
        });

        if (!response.ok) throw new Error('Session Expired');

        const bookings = await response.json();

        let pendingCount = 0;
        let transitCount = 0;

        const tableHTML = bookings.map(b => {
          if (b.status === 'Pending') pendingCount++;
          if (b.status === 'In Transit') transitCount++;

          return `
            <tr>
              <td><strong>${b.trackingId}</strong></td>
              <td>${b.deliveryAddress ? b.deliveryAddress.substring(0, 30) : 'N/A'}...</td>
              <td>${b.weight || 1} kg</td>
              <td>
                <select id="status-${b.trackingId}" class="form-control" style="padding: 5px; font-weight:bold;">
                  <option value="Pending" ${b.status === 'Pending' ? 'selected' : ''}>Pending</option>
                  <option value="In Transit" ${b.status === 'In Transit' ? 'selected' : ''}>Dispatch (In Transit)</option>
                  <option value="Out for Delivery" ${b.status === 'Out for Delivery' ? 'selected' : ''}>Out for Delivery</option>
                  <option value="Delivered" ${b.status === 'Delivered' ? 'selected' : ''}>Delivered</option>
                  <option value="Cancelled" ${b.status === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
                </select>
              </td>
              <td>
                <input type="text" id="loc-${b.trackingId}" class="form-control" value="${b.currentLocation || 'Branch Office'}" style="padding: 5px; width: 100%;">
              </td>
              <td>
                <button onclick="updateBranchRecord('${b.trackingId}')" class="btn btn-primary" style="padding: 6px 12px; font-size: 0.85rem; border: none; cursor: pointer; border-radius: 4px;">Update</button>
              </td>
            </tr>
          `;
        }).join('');

        document.getElementById('branchTableBody').innerHTML = tableHTML || `<tr><td colspan="6" style="text-align:center;">No active operations.</td></tr>`;
        document.getElementById('branchPending').innerText = pendingCount;
        document.getElementById('branchTransit').innerText = transitCount;
      } catch (error) {
        console.error('Error fetching branch data:', error);
        document.getElementById('branchTableBody').innerHTML = `<tr><td colspan="6" style="text-align:center; color: #ff6b6b;"><i class="fas fa-lock"></i> Access Denied. Please log in again.</td></tr>`;
      }
    }

    // FIXED: Secured Update Logic
    async function updateBranchRecord(trackingId) {
      const newStatus = document.getElementById(`status-${trackingId}`).value;
      const newLocation = document.getElementById(`loc-${trackingId}`).value;

      try {
        const token = localStorage.getItem('authToken');
        const response = await fetch(`https://swiftcourier-api.onrender.com/api/bookings/update/${trackingId}`, {
          method: 'PUT',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}` // Provide the VIP pass for updates
          },
          body: JSON.stringify({ status: newStatus, currentLocation: newLocation })
        });

        if (response.ok) {
          alert(`Success! ${trackingId} updated to ${newStatus}.`);
          loadBranchData(); // Refresh UI instantly
        } else {
          alert("Failed to update database.");
        }
      } catch (error) {
        alert("Network Error.");
      }
    }

    document.addEventListener('DOMContentLoaded', loadBranchData);
  </script>
</body>
</html>
