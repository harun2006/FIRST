<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SwiftCourier - Track Parcel</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .timeline {
      display: flex;
      justify-content: space-between;
      position: relative;
      margin-top: 30px;
    }
    .timeline::before {
      content: '';
      position: absolute;
      top: 15px;
      left: 0;
      width: 100%;
      height: 4px;
      background: var(--glass-border);
      z-index: 1;
    }
    .timeline-step {
      position: relative;
      z-index: 2;
      text-align: center;
      background: var(--bg-color);
      padding: 0 8px;
    }
    .step-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--glass-border);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 8px;
    }
    .timeline-step.active .step-icon {
      background: var(--secondary);
    }
    .step-label { font-size: 0.75rem; font-weight: 600; }
  </style>
</head>
<body>

  <!-- Standard Navigation Bar -->
  <nav class="navbar">
    <a href="index.html" class="logo"><i class="fas fa-box-open"></i> SwiftCourier</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="tracking.html" class="active">Track Parcel</a></li>
      <li><a href="booking.html">Book Parcel</a></li>
      <li><a href="#" onclick="routeToDashboard(event)">Dashboards</a></li>
    <div class="nav-btns">
      <button class="theme-toggle" onclick="SwiftCourier.toggleTheme()"><i class="fas fa-moon"></i></button>
      <a href="login.html" class="btn btn-primary">Login</a>
      <div class="hamburger"><i class="fas fa-bars"></i></div>
    </div>
  </nav>

  <div style="max-width: 800px; margin: 40px auto; padding: 0 20px;">
    <div class="glass" style="padding: 20px; display: flex; gap: 10px;">
      <input type="text" id="trackSearchInput" class="form-control" placeholder="Enter Tracking Number (e.g., TRK-98231)" style="flex:1;">
      <button id="trackBtn" class="btn btn-primary">Track</button>
    </div>

    <div id="trackingResult"></div>
  </div>

  <script src="js/app.js"></script>
  <script>
    document.getElementById('trackBtn').addEventListener('click', async () => {
      const trackingId = document.getElementById('trackSearchInput').value.trim();
      const resultDiv = document.getElementById('trackingResult');

      if (!trackingId) {
        resultDiv.innerHTML = `<div class="glass" style="padding: 20px; margin-top: 20px; color: #ff6b6b; text-align: center;">Please enter a Tracking ID.</div>`;
        return;
      }

      // Show a loading spinner while waiting for the database
      resultDiv.innerHTML = `<div class="glass" style="padding: 20px; margin-top: 20px; text-align: center;"><i class="fas fa-spinner fa-spin"></i> Searching Database...</div>`;

      try {
        // Fetch the specific parcel from your backend
        const response = await fetch(`https://swiftcourier-backend-live.onrender.com/api/bookings/${trackingId}`);
        const data = await response.json();

        if (response.ok) {
          // Determine which steps in the timeline should be highlighted
          const statuses = ["Pending", "In Transit", "Out for Delivery", "Delivered"];
          let currentIndex = statuses.indexOf(data.status);
          if (currentIndex === -1) currentIndex = 0; // Fallback to pending

          const icons = ["fa-box", "fa-truck-fast", "fa-map-location-dot", "fa-house-circle-check"];
          
          // Generate the timeline HTML dynamically
          const stepHTML = statuses.map((status, index) => {
            const isActive = index <= currentIndex ? "active" : "";
            return `
              <div class="timeline-step ${isActive}">
                <div class="step-icon"><i class="fas ${icons[index]}"></i></div>
                <div class="step-label">${status}</div>
              </div>
            `;
          }).join('');

          // Render the beautiful tracking card with live data
          resultDiv.innerHTML = `
            <div class="glass" style="padding: 30px; margin-top: 20px; border-radius: var(--radius);">
              <div style="display: flex; justify-content: space-between; border-bottom: 1px solid var(--glass-border); padding-bottom: 15px; margin-bottom: 20px; flex-wrap: wrap; gap: 15px;">
                <div>
                  <h3 style="color: var(--primary); margin-bottom: 5px;">Tracking ID: ${data.trackingId}</h3>
                  <p style="color: var(--text-muted); font-size: 0.95rem;">From: <strong>${data.senderName}</strong> &nbsp;|&nbsp; To: <strong>${data.receiverName}</strong></p>
                  <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 5px;">Weight: ${data.weight} kg</p>
                </div>
                <div style="text-align: right;">
                  <span style="background: var(--secondary); color: white; padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 0.85rem;">
                    ${data.status}
                  </span>
                  <p style="color: var(--text-primary); font-size: 0.9rem; margin-top: 10px; font-weight: 600;">
                    <i class="fas fa-location-dot" style="color: #ff4d4d;"></i> Current Location:
                  </p>
                  <p style="color: var(--text-muted); font-size: 0.85rem;">${data.currentLocation || "Origin Sorting Facility"}</p>
                </div>
              </div>
              
              <div class="timeline">
                ${stepHTML}
              </div>
            </div>
          `;
        } else {
          // Parcel not found
          resultDiv.innerHTML = `
            <div class="glass" style="padding: 20px; margin-top: 20px; color: #ff6b6b; text-align: center;">
              <i class="fas fa-search-minus" style="font-size: 2rem; margin-bottom: 10px; display: block;"></i>
              ${data.error || 'Tracking ID not found. Please check your number and try again.'}
            </div>`;
        }
      } catch (error) {
        console.error('Tracking Error:', error);
        resultDiv.innerHTML = `<div class="glass" style="padding: 20px; margin-top: 20px; color: #ff6b6b; text-align: center;"><i class="fas fa-wifi"></i> Network Error: Could not connect to server.</div>`;
      }
    });

    // Allow users to press "Enter" in the search box to track
    document.getElementById('trackSearchInput').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        document.getElementById('trackBtn').click();
      }
    });
  </script>
  <script>
  function routeToDashboard(event) {
      event.preventDefault(); // Stop the '#' from appearing

      // Grab the user's role from their browser storage
      const role = localStorage.getItem('userRole');

      // Check the role and route them instantly
      if (role === 'admin') {
          window.location.href = 'admin.html';
      } else if (role === 'branch') {
          window.location.href = 'branch.html';
      } else if (role === 'agent') {
          window.location.href = 'delivery.html';
      } else if (role === 'customer') {
          window.location.href = 'customer.html';
      } else {
          // If no one is logged in, ask them to log in
          window.location.href = 'login.html';
      }
  }
  // Allow users to press "Enter" in the search box to track
    document.getElementById('trackSearchInput').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        document.getElementById('trackBtn').click();
      }
    });

    // --- NEW: AUTO-TRACK FROM DASHBOARD URL ---
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Look at the web address (URL)
      const urlParams = new URLSearchParams(window.location.search);
      
      // 2. See if there is an "?id=" attached to it
      const autoTrackId = urlParams.get('id');

      // 3. If there is, paste it into the search box and click the button!
      if (autoTrackId) {
        document.getElementById('trackSearchInput').value = autoTrackId;
        document.getElementById('trackBtn').click();
      }
    });
    document.addEventListener('DOMContentLoaded', () => {
  const urlParams = new URLSearchParams(window.location.search);
  const autoTrackId = urlParams.get('id');

  if (autoTrackId) {
    const input = document.getElementById('trackSearchInput');
    const btn = document.getElementById('trackBtn');
    if (input && btn) {
      input.value = autoTrackId;
      btn.click(); // Automatically triggers the database query
    }
  }
});
</script>
</body>
</html>
