<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SwiftCourier - Register</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .register-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: calc(100vh - 120px);
      padding: 20px;
    }
    .register-card {
      width: 100%;
      max-width: 420px;
      padding: 40px;
      margin: 0 auto;
      border-radius: 16px;
    }
    .register-card h2 {
      text-align: center;
      margin-bottom: 10px;
      font-size: 1.8rem;
    }
    .register-card p.subtitle {
      text-align: center;
      color: var(--text-muted);
      margin-bottom: 25px;
      font-size: 0.95rem;
    }
    .register-card .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 15px;
      width: 100%;
    }
    .register-card .form-group label {
      font-weight: 500;
      font-size: 0.9rem;
    }
    .register-card .form-control {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
      font-size: 0.95rem;
      outline: none;
      box-sizing: border-box;
    }
    .register-card .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(21, 101, 192, 0.2);
    }
    .login-link {
      text-align: center;
      margin-top: 20px;
      font-size: 0.9rem;
    }
    .login-link a {
      color: var(--secondary);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Minimal Navigation Bar for Registration -->
  <nav class="navbar">
    <a href="index.html" class="logo"><i class="fas fa-box-open"></i> SwiftCourier</a>
    
    <!-- We removed the <ul> list of links completely! -->
    
    <div class="nav-btns">
      <button class="theme-toggle" onclick="SwiftCourier.toggleTheme()"><i class="fas fa-moon"></i></button>
      <a href="login.html" class="btn btn-primary">Login</a>
    </div>
  </nav>

  <div class="register-container">
    <div class="glass register-card">
      <h2>Create Account</h2>
      <p class="subtitle">Join the SwiftCourier network today.</p>
      
      <form id="registerForm">
        <div class="form-group">
          <label for="regName">Full Name</label>
          <input type="text" id="regName" class="form-control" placeholder="Enter your full name" required>
        </div>

        <!-- FIXED: Added Email Field back in! -->
        <div class="form-group">
          <label for="regEmail">Email Address</label>
          <input type="email" id="regEmail" class="form-control" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
          <label for="regUsername">Username</label>
          <input type="text" id="regUsername" class="form-control" placeholder="Choose a username" required>
        </div>

        <div class="form-group">
          <label for="regPassword">Password</label>
          <input type="password" id="regPassword" class="form-control" placeholder="Create a strong password" required>
        </div>

        <div class="form-group">
          <label for="regRole">Account Type</label>
          <select id="regRole" class="form-control">
            <option value="customer">Customer</option>
            <option value="agent">Delivery Agent</option>
          </select>
        </div>

        <button type="submit" id="registerBtn" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 10px; padding: 12px;">Sign Up</button>
      </form>
      
      <div class="login-link">
        Already have an account? <a href="login.html">Log in here</a>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault(); 

      const name = document.getElementById('regName').value;
      const email = document.getElementById('regEmail').value; // Grab the email value
      const username = document.getElementById('regUsername').value;
      const password = document.getElementById('regPassword').value;
      const role = document.getElementById('regRole').value;
      const registerBtn = document.getElementById('registerBtn');
      
      const originalText = registerBtn.innerText;
      registerBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating Account...';
      registerBtn.disabled = true;

      try {
        const response = await fetch('https://swiftcourier-backend-live.onrender.com/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, username, password, role }) // Send email to backend
        });

        const data = await response.json();

        if (response.ok) {
          SwiftCourier.showToast('Account created successfully! Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 2000);
        } else {
          SwiftCourier.showToast(data.message || data.error || 'Registration failed.', 'error');
        }
      } catch (error) {
        console.error('Registration error:', error);
        SwiftCourier.showToast('Failed to connect to the server. Is it running?', 'error');
      } finally {
        registerBtn.innerText = originalText;
        registerBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
