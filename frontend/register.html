<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SwiftCourier - Register</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Basic centering for the auth box */
    .auth-container { display: flex; justify-content: center; align-items: center; min-height: 85vh; padding: 20px; }
    .auth-box { width: 100%; max-width: 450px; padding: 40px; text-align: center; border-radius: 16px; }
    .form-group { text-align: left; margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: 600; }
    .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid var(--glass-border); border-radius: 8px; background: rgba(255, 255, 255, 0.1); color: var(--text-primary); }
    
    /* --- ANIMATED SUCCESS MODAL STYLES --- */
    .success-modal-overlay {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background: rgba(0, 0, 0, 0.6);
        display: none; align-items: center; justify-content: center;
        z-index: 3000; backdrop-filter: blur(5px);
        opacity: 0; transition: opacity 0.3s ease;
    }
    .success-modal-overlay.active { display: flex; opacity: 1; }
    
    .success-modal-box {
        background: #ffffff;
        border: 1px solid var(--glass-border);
        width: 90%; max-width: 400px; padding: 40px 30px;
        text-align: center; border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        transform: translateY(30px) scale(0.95);
        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    
    /* Dark Mode Support for Modal */
    body.dark-theme .success-modal-box {
        background: rgba(30, 30, 30, 0.95);
        color: #e0e0e0;
    }

    .success-modal-overlay.active .success-modal-box {
        transform: translateY(0) scale(1);
    }

    .success-icon {
        font-size: 4.5rem; color: #4CAF50; margin-bottom: 20px;
        animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        animation-delay: 0.1s;
        opacity: 0; transform: scale(0);
    }

    @keyframes popIn {
        to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <a href="index.html" class="logo"><i class="fas fa-box-open"></i> SwiftCourier</a>
    <div class="nav-btns">
      <button class="theme-toggle" onclick="SwiftCourier.toggleTheme()">
        <i class="fas fa-moon"></i>
      </button>
      <a href="login.html" class="btn btn-primary">Login</a>
    </div>
  </nav>

  <!-- Registration Form -->
  <div class="auth-container">
    <div class="auth-box glass">
      <h2 style="margin-bottom: 25px; color: var(--text-primary);">Create Account</h2>
      
      <form id="registerForm">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="regName" placeholder="John Doe" required>
        </div>
        
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="regUsername" placeholder="johndoe99" required>
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="regEmail" placeholder="john@example.com" required>
        </div>
        
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="regPassword" placeholder="Minimum 6 characters" required>
        </div>

        <div class="form-group">
          <label>Account Type</label>
          <select id="regRole" class="form-control" required>
            <option value="customer" selected>Customer (Send/Track Parcels)</option>
            <option value="agent">Delivery Agent (Manage Deliveries)</option>
          </select>
        </div>
        
        <p id="errorMessage" style="color: #f44336; font-size: 0.9rem; margin-bottom: 15px; display: none;"></p>
        
        <button type="submit" class="btn btn-primary" style="width: 100%; font-size: 1.1rem; padding: 12px;">Create Account</button>
      </form>
      
      <p style="margin-top: 20px; font-size: 0.9rem; color: var(--text-muted);">
        Already have an account? <a href="login.html" style="color: #FF9800; font-weight: bold; text-decoration: none;">Sign in here</a>
      </p>
    </div>
  </div>

  <!-- Animated Success Modal -->
  <div class="success-modal-overlay" id="registerSuccessModal">
    <div class="success-modal-box">
      <i class="fas fa-user-check success-icon"></i>
      <h2 style="margin-bottom: 10px;">Registration Successful!</h2>
      <p style="color: var(--text-muted); font-size: 0.95rem;">Welcome to SwiftCourier! Your <span id="modalRoleText" style="font-weight: bold; color: var(--primary);"></span> account has been created.</p>
      
      <button class="btn btn-primary" onclick="window.location.href='login.html'" style="width: 100%; padding: 14px; font-size: 1.05rem; border-radius: 8px; margin-top: 25px;">
        Proceed to Login <i class="fas fa-arrow-right" style="margin-left: 8px;"></i>
      </button>
    </div>
  </div>

  <script src="js/app.js"></script>
  
  <script>
    document.getElementById('registerForm').addEventListener('submit', async function(event) {
        event.preventDefault(); 
        
        const submitBtn = this.querySelector('button[type="submit"]');
        const errorMsg = document.getElementById('errorMessage');
        
        const userData = {
            name: document.getElementById('regName').value,
            username: document.getElementById('regUsername').value,
            email: document.getElementById('regEmail').value,
            password: document.getElementById('regPassword').value,
            role: document.getElementById('regRole').value
        };
        
        const originalText = submitBtn.innerHTML;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Registering...';
        submitBtn.disabled = true;
        errorMsg.style.display = 'none';

        try {
            const response = await fetch('https://swiftcourier-backend-live.onrender.com/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(userData)
            });
            
            const data = await response.json();
            
            if (response.ok) {
                // Determine text to show in the modal based on role chosen
                const displayRole = userData.role === 'customer' ? 'Customer' : 'Delivery Agent';
                document.getElementById('modalRoleText').innerText = displayRole;
                
                // Trigger the animated modal
                document.getElementById('registerSuccessModal').classList.add('active');
            } else {
                errorMsg.textContent = data.error || 'Registration failed';
                errorMsg.style.display = 'block';
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        } catch (error) {
            console.error("Register Error:", error);
            errorMsg.textContent = "Cannot connect to server. Please try again.";
            errorMsg.style.display = 'block';
            submitBtn.innerHTML = originalText;
            submitBtn.disabled = false;
        }
    });
  </script>
</body>
</html>
