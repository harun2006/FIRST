<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SwiftCourier - Login</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .auth-container { display: flex; justify-content: center; align-items: center; min-height: 80vh; }
    .auth-box { width: 100%; max-width: 400px; padding: 40px; text-align: center; border-radius: 16px; }
    .form-group { text-align: left; margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: 600; }
    .form-group input { width: 100%; padding: 12px; border: 1px solid var(--glass-border); border-radius: 8px; background: rgba(255, 255, 255, 0.1); color: var(--text-primary); }
    
    /* --- ANIMATED SMART MODAL STYLES --- */
    .success-modal-overlay {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background: rgba(0, 0, 0, 0.6);
        display: none; align-items: center; justify-content: center;
        z-index: 3000; backdrop-filter: blur(5px);
        opacity: 0; transition: opacity 0.3s ease;
    }
    .success-modal-overlay.active { display: flex; opacity: 1; }
    
    .success-modal-box {
        background: #ffffff;
        border: 1px solid var(--glass-border);
        width: 90%; max-width: 400px; padding: 40px 30px;
        text-align: center; border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        transform: translateY(30px) scale(0.95);
        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    
    body.dark-theme .success-modal-box {
        background: rgba(30, 30, 30, 0.95);
        color: #e0e0e0;
    }

    .success-modal-overlay.active .success-modal-box { transform: translateY(0) scale(1); }

    .success-icon {
        font-size: 4.5rem; color: #4CAF50; margin-bottom: 20px;
        animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        animation-delay: 0.1s;
        opacity: 0; transform: scale(0);
    }

    @keyframes popIn {
        to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <a href="index.html" class="logo"><i class="fas fa-box-open"></i> SwiftCourier</a>
    <div class="nav-btns">
      <button class="theme-toggle" onclick="SwiftCourier.toggleTheme()">
        <i class="fas fa-moon"></i>
      </button>
      <a href="register.html" class="btn btn-primary">Register</a>
    </div>
  </nav>

  <!-- Login Form -->
  <div class="auth-container">
    <div class="auth-box glass">
      <h2 style="margin-bottom: 25px; color: var(--text-primary);">Welcome Back</h2>
      
      <form id="loginForm">
        <div class="form-group">
          <label>Username / Email</label>
          <input type="text" id="loginId" placeholder="user@swiftcourier.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="........" required>
        </div>
        
        <p id="errorMessage" style="color: #f44336; font-size: 0.9rem; margin-bottom: 10px; display: none;"></p>
        
        <button type="submit" class="btn btn-primary" style="width: 100%; font-size: 1.1rem; padding: 12px;">Sign In</button>
      </form>
      
      <p style="margin-top: 20px; font-size: 0.9rem; color: var(--text-muted);">
        Don't have an account? <a href="register.html" style="color: #FF9800; font-weight: bold; text-decoration: none;">Register here</a>
      </p>
    </div>
  </div>

  <!-- Dynamic Smart Modal -->
  <div class="success-modal-overlay" id="authModal">
    <div class="success-modal-box">
      <i class="" id="modalIcon"></i>
      <h2 id="modalTitle" style="margin-bottom: 10px;">Success</h2>
      <p id="modalMessage" style="color: var(--text-muted); font-size: 0.95rem;">Action completed.</p>
    </div>
  </div>

  <script src="js/app.js"></script>
  
  <script>
    // --- 1. LOGOUT DETECTION ---
    // If the URL says ?loggedOut=true, trigger the logout animation!
    document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('loggedOut') === 'true') {
            document.getElementById('modalIcon').className = 'fas fa-right-from-bracket success-icon';
            document.getElementById('modalIcon').style.color = '#FF9800'; // Orange for logout
            document.getElementById('modalTitle').innerText = 'Logged Out';
            document.getElementById('modalMessage').innerText = 'You have been securely logged out of your account.';
            document.getElementById('authModal').classList.add('active');

            // Hide the modal after 2 seconds and clean the URL bar
            setTimeout(() => {
                document.getElementById('authModal').classList.remove('active');
                window.history.replaceState({}, document.title, "login.html");
            }, 2000);
        }
    });

    // --- 2. LOGIN LOGIC ---
    document.getElementById('loginForm').addEventListener('submit', async function(event) {
        event.preventDefault(); 
        
        const submitBtn = this.querySelector('button[type="submit"]');
        const loginId = document.getElementById('loginId').value;
        const password = document.getElementById('loginPassword').value;
        const errorMsg = document.getElementById('errorMessage');
        
        const originalText = submitBtn.innerHTML;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing In...';
        submitBtn.disabled = true;
        errorMsg.style.display = 'none';

        try {
            const response = await fetch('https://swiftcourier-backend-live.onrender.com/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: loginId, password: password })
            });
            
            const data = await response.json();
            
            if (response.ok) {
                localStorage.setItem('token', data.token);
                localStorage.setItem('userRole', data.role);
                
                // Trigger the Login Success Animation
                document.getElementById('modalIcon').className = 'fas fa-unlock-keyhole success-icon';
                document.getElementById('modalIcon').style.color = '#4CAF50'; // Green for login
                document.getElementById('modalTitle').innerText = 'Login Successful!';
                document.getElementById('modalMessage').innerText = 'Loading your personalized dashboard...';
                document.getElementById('authModal').classList.add('active');
                
                // Pause for 1.5 seconds so they can see the animation, then redirect
                setTimeout(() => {
                    if (data.role === 'admin') window.location.href = 'admin.html';
                    else if (data.role === 'branch') window.location.href = 'branch.html';
                    else if (data.role === 'agent') window.location.href = 'delivery.html';
                    else if (data.role === 'customer') window.location.href = 'customer.html';
                    else window.location.href = 'index.html'; 
                }, 1500);

            } else {
                errorMsg.textContent = data.error || 'Login failed';
                errorMsg.style.display = 'block';
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        } catch (error) {
            console.error("Login Error:", error);
            errorMsg.textContent = "Cannot connect to server. Please try again.";
            errorMsg.style.display = 'block';
            submitBtn.innerHTML = originalText;
            submitBtn.disabled = false;
        }
    });
  </script>
</body>
</html>
