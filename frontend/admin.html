<script>
    function routeToDashboard(event) {
      event.preventDefault(); 
      const role = localStorage.getItem('userRole');
      if (role === 'admin') window.location.href = 'admin.html';
      else if (role === 'branch') window.location.href = 'branch.html';
      else if (role === 'agent') window.location.href = 'delivery.html';
      else if (role === 'customer') window.location.href = 'customer.html';
      else window.location.href = 'login.html';
    }

    let currentAdminAction = null;
    let selectedAdminId = null;
    let adminBarChart = null;
    let adminPieChart = null;

    // --- SECURITY & BOOTSTRAP ---
    document.addEventListener('DOMContentLoaded', () => {
        // 1. Grab the VIP pass (Token) and Role from Local Storage
        const token = localStorage.getItem('token');
        const userRole = localStorage.getItem('userRole');

        // 2. Security Check: Kick them out if they aren't an admin
        if (!token || userRole !== 'admin') {
            window.location.href = 'login.html';
            return; 
        }

        // 3. UI Update: Change the "Login" button to "Logout"
        const loginBtn = document.querySelector('.btn-primary') || document.querySelector('a[href="login.html"]');
        if (loginBtn) {
            loginBtn.textContent = 'Logout';
            loginBtn.href = '#'; 
            loginBtn.addEventListener('click', (e) => {
                e.preventDefault();
                localStorage.removeItem('token');
                localStorage.removeItem('userRole');
                window.location.href = 'login.html';
            });
        }

        // 4. Fetch the secure data!
        loadAdminDashboard(token);
    });

    // --- DATA FETCHING ---
    async function loadAdminDashboard(token) {
      try {
        // FIXED: Using your real live backend URL!
        const response = await fetch('https://swiftcourier-backend-live.onrender.com/api/bookings/all', {
          method: 'GET',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}` 
          }
        });

        if (!response.ok) throw new Error('Session Expired or Unauthorized');

        const parcels = await response.json();
        
        // Update Stats
        document.getElementById('adminTotalParcels').innerText = parcels.length;
        
        let totalRevenue = 0;
        const uniqueCustomers = new Set();
        const typeCounts = { 'Standard': 0, 'Express': 0, 'Fragile': 0, 'Heavy': 0 };
        let activeParcelsCount = 0;
        let deliveredParcelsCount = 0;
        
        parcels.forEach(p => {
          const weight = p.weight || 1;
          totalRevenue += (150 + (weight * 50));
          
          if (p.senderName) uniqueCustomers.add(p.senderName);

          const pType = p.parcelType || 'Standard';
          if (typeCounts[pType] !== undefined) {
             typeCounts[pType]++;
          } else {
             typeCounts['Standard']++; 
          }

          if (p.status === 'Delivered') {
            deliveredParcelsCount++;
          } else if (p.status !== 'Cancelled') {
            activeParcelsCount++;
          }
        });
        
        document.getElementById('adminRevenue').innerText = '₹' + totalRevenue.toFixed(2);
        document.getElementById('adminCustomers').innerText = uniqueCustomers.size;

        // Render Charts
        renderCharts(activeParcelsCount, deliveredParcelsCount, typeCounts);

        // Render Table
        const tableBody = document.getElementById('adminParcelsTable');
        
        if (parcels.length === 0) {
          tableBody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding: 20px;">No parcels in the system.</td></tr>`;
          return;
        } 

        tableBody.innerHTML = parcels.map(p => {
          const weight = p.weight || 1;
          const cost = 150 + (weight * 50);
          let badgeClass = 'transit';
          if (p.status === 'Delivered') badgeClass = 'delivered';
          if (p.status === 'Cancelled') badgeClass = 'cancelled';
          if (p.status === 'Pending') badgeClass = 'pending';

          return `
            <tr>
              <td><strong>${p.trackingId}</strong></td>
              <td>${p.senderName || 'N/A'}</td>
              <td>${p.receiverName || 'N/A'}</td>
              <td><span class="badge ${badgeClass}">${p.status}</span></td>
              <td>₹${cost.toFixed(2)}</td>
              <td>
                <div class="action-btns">
                  <button class="btn btn-warning" onclick="openStatusModal('${p.trackingId}', '${p.status}')">Update</button>
                  <button class="btn btn-danger" onclick="openAdminModal('delete', '${p.trackingId}')"><i class="fas fa-trash"></i> Delete</button>
                </div>
              </td>
            </tr>
          `;
        }).join('');
        
      } catch (error) {
        console.error('Error fetching admin data:', error);
        document.getElementById('adminParcelsTable').innerHTML = `<tr><td colspan="6" style="text-align:center; color: #ff6b6b;"><i class="fas fa-lock"></i> Access Denied. Please log in as Admin.</td></tr>`;
      }
    }

    function renderCharts(active, delivered, typeCounts) {
      if (adminBarChart) adminBarChart.destroy();
      if (adminPieChart) adminPieChart.destroy();

      const barCtx = document.getElementById('barChartCanvas').getContext('2d');
      adminBarChart = new Chart(barCtx, {
        type: 'bar',
        data: {
          labels: ['Active Shipments', 'Delivered'],
          datasets: [{
            label: 'Total Parcels',
            data: [active, delivered],
            backgroundColor: ['#1565C0', '#4CAF50'],
            borderRadius: 6
          }]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });

      const pieCtx = document.getElementById('pieChartCanvas').getContext('2d');
      adminPieChart = new Chart(pieCtx, {
        type: 'doughnut',
        data: {
          labels: Object.keys(typeCounts),
          datasets: [{
            data: Object.values(typeCounts),
            backgroundColor: ['#1976D2', '#FF9800', '#f44336', '#9C27B0'],
            borderWidth: 0
          }]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });
    }

    /* --- STATUS MODAL LOGIC --- */
    let currentUpdateId = null;

    function openStatusModal(trackingId, currentStatus) {
      currentUpdateId = trackingId;
      document.getElementById('modalTrackingId').innerText = trackingId;
      document.getElementById('newStatusSelect').value = currentStatus;
      document.getElementById('statusUpdateModal').classList.add('active');
    }

    function closeStatusModal() {
      currentUpdateId = null;
      document.getElementById('statusUpdateModal').classList.remove('active');
    }

    async function submitStatusUpdate() {
      if (!currentUpdateId) return;
      
      const newStatus = document.getElementById('newStatusSelect').value;
      const updateBtn = document.getElementById('submitStatusBtn');
      const token = localStorage.getItem('token'); // FIXED token reference
      
      const originalText = updateBtn.innerHTML;
      updateBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
      updateBtn.disabled = true;

      try {
        const response = await fetch(`https://swiftcourier-backend-live.onrender.com/api/bookings/update/${currentUpdateId}`, {
          method: 'PUT',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}` 
          },
          body: JSON.stringify({ status: newStatus, currentLocation: 'Updated by System Admin' })
        });
        
        if (response.ok) {
           if (typeof SwiftCourier !== 'undefined' && SwiftCourier.showToast) {
             SwiftCourier.showToast(`Status updated to ${newStatus}`, 'success');
           }
           closeStatusModal();
           loadAdminDashboard(token); // Refresh table data instantly
        } else {
           if (typeof SwiftCourier !== 'undefined' && SwiftCourier.showToast) {
             SwiftCourier.showToast('Failed to update status.', 'error');
           }
        }
      } catch (error) {
        console.error(error);
        if (typeof SwiftCourier !== 'undefined' && SwiftCourier.showToast) {
           SwiftCourier.showToast('Server error. Is the backend running?', 'error');
        }
      } finally {
        updateBtn.innerHTML = originalText;
        updateBtn.disabled = false;
      }
    }

    /* --- DELETE MODAL LOGIC --- */
    function openAdminModal(action, trackingId) {
      currentAdminAction = action;
      selectedAdminId = trackingId;
      document.getElementById('adminModalTitle').innerText = 'Delete System Record';
      document.getElementById('adminModalText').innerText = `Are you absolutely sure you want to permanently delete the record for ${trackingId}?`;
      document.getElementById('adminModalIcon').className = 'fas fa-triangle-exclamation';
      document.getElementById('adminModalIcon').style.color = '#f44336';
      document.getElementById('adminModal').classList.add('active');
    }

    function closeAdminModal() {
      currentAdminAction = null;
      selectedAdminId = null;
      document.getElementById('adminModal').classList.remove('active');
    }

    document.getElementById('confirmAdminModalBtn').addEventListener('click', async () => {
      if (currentAdminAction === 'delete' && selectedAdminId) {
        const token = localStorage.getItem('token'); // FIXED token reference
        try {
          await fetch(`https://swiftcourier-backend-live.onrender.com/api/bookings/${selectedAdminId}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` }
          });
          
          if (typeof SwiftCourier !== 'undefined' && SwiftCourier.showToast) {
             SwiftCourier.showToast('Parcel deleted successfully.', 'success');
          }
          
          closeAdminModal();
          loadAdminDashboard(token); 
        } catch (error) {
          if (typeof SwiftCourier !== 'undefined' && SwiftCourier.showToast) {
             SwiftCourier.showToast('Failed to delete parcel.', 'error');
          }
        }
      }
    });
  </script>
