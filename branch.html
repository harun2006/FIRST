<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SwiftCourier - Branch Manager Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .action-btns {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .btn-sm {
      padding: 4px 10px;
      font-size: 0.75rem;
    }
    .btn-primary {
      background: linear-gradient(135deg, #1565C0, #0D47A1);
      color: white;
    }
    .btn-warning {
      background: linear-gradient(135deg, #FF9800, #F57C00);
      color: white;
    }
    .btn-success {
      background: linear-gradient(135deg, #4CAF50, #2E7D32);
      color: white;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="logo"><i class="fas fa-building-flag"></i> Branch Hub Manager</a>
    <button class="theme-toggle" onclick="SwiftCourier.toggleTheme()"><i class="fas fa-moon"></i></button>
  </nav>

  <div class="dashboard-container">
    <aside class="sidebar glass">
      <a href="branch.html" class="active"><i class="fas fa-warehouse"></i> Hub Management</a>
      <a href="booking.html"><i class="fas fa-plus-circle"></i> Counter Booking</a>
      <a href="login.html"><i class="fas fa-sign-out-alt"></i> Sign Out</a>
    </aside>

    <main class="main-content">
      <!-- Hub Metrics Summary -->
      <div class="stats-grid">
        <div class="stat-card glass">
          <div class="stat-icon"><i class="fas fa-inbox"></i></div>
          <div class="stat-info"><h3 id="statInbound">0</h3><p>Inbound / Received</p></div>
        </div>
        <div class="stat-card glass">
          <div class="stat-icon"><i class="fas fa-filter"></i></div>
          <div class="stat-info"><h3 id="statSorted">0</h3><p>Sorted Packages</p></div>
        </div>
        <div class="stat-card glass">
          <div class="stat-icon"><i class="fas fa-truck-fast"></i></div>
          <div class="stat-info"><h3 id="statDispatched">0</h3><p>Dispatched Out</p></div>
        </div>
      </div>

      <!-- Hub Inventory Table -->
      <div class="glass" style="padding: 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 15px;">
          <h3>Branch Package Operations</h3>
          <input type="text" id="branchSearch" class="form-control" placeholder="Search Tracking ID or Sender..." style="width: 250px; padding: 6px 12px;">
        </div>

        <div class="table-responsive">
          <table class="custom-table">
            <thead>
              <tr>
                <th>Tracking ID</th>
                <th>Sender</th>
                <th>Current Status</th>
                <th>Current Location</th>
                <th>Hub Operations</th>
              </tr>
            </thead>
            <tbody id="branchParcelsTable">
              <!-- Dynamically populated -->
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="js/app.js"></script>
  <script>
    function updateBranchStats() {
      const inbound = SwiftCourier.parcels.filter(p => p.status === 'Booked' || p.status === 'Collected').length;
      const sorted = SwiftCourier.parcels.filter(p => p.status === 'Sorted').length;
      const dispatched = SwiftCourier.parcels.filter(p => p.status === 'Dispatched' || p.status === 'Out For Delivery').length;

      document.getElementById('statInbound').innerText = inbound;
      document.getElementById('statSorted').innerText = sorted;
      document.getElementById('statDispatched').innerText = dispatched;
    }

    function renderBranchTable(filter = '') {
      const tableBody = document.getElementById('branchParcelsTable');
      if (!tableBody) return;

      const filteredParcels = SwiftCourier.parcels.filter(p => 
        p.id.toLowerCase().includes(filter.toLowerCase()) || 
        p.sender.toLowerCase().includes(filter.toLowerCase()) ||
        p.receiver.toLowerCase().includes(filter.toLowerCase())
      );

      if (filteredParcels.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="5" style="text-align:center; color: var(--text-muted); padding:20px;">No hub packages match your search.</td></tr>`;
        return;
      }

      tableBody.innerHTML = filteredParcels.map(p => {
        const isDelivered = p.status === 'Delivered';
        const isCancelled = p.status === 'Cancelled';

        let badgeClass = 'transit';
        if (isDelivered) badgeClass = 'delivered';
        if (isCancelled) badgeClass = 'cancelled';

        return `
          <tr>
            <td><strong>${p.id}</strong></td>
            <td>${p.sender}</td>
            <td><span class="badge ${badgeClass}">${p.status}</span></td>
            <td><small>${p.currentLoc}</small></td>
            <td>
              <div class="action-btns">
                ${!isDelivered && !isCancelled ? `
                  <button class="btn btn-warning btn-sm" onclick="advancePipeline('${p.id}', 'Sorted', 'Regional Sorting Facility')">
                    <i class="fas fa-boxes-packing"></i> Sort
                  </button>
                  <button class="btn btn-primary btn-sm" onclick="advancePipeline('${p.id}', 'Dispatched', 'Transit to Destination Branch')">
                    <i class="fas fa-route"></i> Dispatch
                  </button>
                  <button class="btn btn-success btn-sm" onclick="advancePipeline('${p.id}', 'Out For Delivery', 'Assigned to Local Courier')">
                    <i class="fas fa-truck"></i> Assign Delivery
                  </button>
                ` : `<span style="color:var(--text-muted); font-size:0.85rem;">Processing Completed</span>`}
              </div>
            </td>
          </tr>
        `;
      }).join('');

      updateBranchStats();
    }

    function advancePipeline(trackingId, nextStatus, locationUpdate) {
      const idx = SwiftCourier.parcels.findIndex(p => p.id === trackingId);
      if (idx !== -1) {
        SwiftCourier.parcels[idx].status = nextStatus;
        SwiftCourier.parcels[idx].currentLoc = locationUpdate;

        if (!SwiftCourier.parcels[idx].history.includes(nextStatus)) {
          SwiftCourier.parcels[idx].history.push(nextStatus);
        }

        localStorage.setItem('parcels', JSON.stringify(SwiftCourier.parcels));
        SwiftCourier.showToast(`Updated ${trackingId} stage to "${nextStatus}"`, 'success');
        renderBranchTable(document.getElementById('branchSearch').value);
      }
    }

    document.getElementById('branchSearch').addEventListener('input', (e) => {
      renderBranchTable(e.target.value);
    });

    document.addEventListener('DOMContentLoaded', () => {
      renderBranchTable();
    });
  </script>
</body>
</html>
