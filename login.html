<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SwiftCourier - Authentication</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="form-card glass" style="margin-top: 80px;">
    <h2 style="text-align: center; margin-bottom: 25px;">Welcome Back</h2>
    
    <form id="loginForm">
      <div class="form-group" style="margin-bottom: 15px;">
        <label>Email Address</label>
        <input type="email" id="loginEmail" class="form-control" placeholder="user@swiftcourier.com" required>
      </div>

      <div class="form-group" style="margin-bottom: 15px;">
        <label>Password</label>
        <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
      </div>

      <div class="form-group" style="margin-bottom: 20px;">
        <label>Account Role</label>
        <select id="loginRole" class="form-control">
          <option value="customer">Customer</option>
          <option value="agent">Booking/Delivery Agent</option>
          <option value="branch">Branch Manager</option>
          <option value="admin">System Admin</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">Sign In</button>
    </form>
  </div>

  <script src="js/app.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const role = document.getElementById('loginRole').value;
      SwiftCourier.showToast('Login successful! Redirecting...', 'success');
      
      setTimeout(() => {
        if(role === 'admin') window.location.href = 'admin.html';
        else if(role === 'branch') window.location.href = 'branch.html';
        else if(role === 'agent') window.location.href = 'delivery.html';
	else if(role === 'agent') window.location.href = 'delivery.html';
        else window.location.href = 'customer.html';
      }, 1000);
    });
  </script>
</body>
</html>
