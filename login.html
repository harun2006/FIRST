<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SwiftCourier - Authentication</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Precise Frame Form Centering & Layout */
    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: calc(100vh - 120px);
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 40px;
      margin: 0 auto;
      border-radius: 16px;
    }

    .login-card h2 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 1.8rem;
    }

    .login-card .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px;
      width: 100%;
    }

    .login-card .form-group label {
      font-weight: 500;
      font-size: 0.9rem;
    }

    .login-card .form-control {
      width: 100%;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
      font-size: 0.95rem;
      outline: none;
      box-sizing: border-box;
    }

    .login-card .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(21, 101, 192, 0.2);
    }
  </style>
</head>
<body>

  <!-- Standard Navigation Bar -->
  <nav class="navbar">
    <a href="index.html" class="logo"><i class="fas fa-box-open"></i> SwiftCourier</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="tracking.html">Track Parcel</a></li>
      <li><a href="booking.html">Book Parcel</a></li>
      <li><a href="admin.html">Dashboards</a></li>
    </ul>
    <div class="nav-btns">
      <button class="theme-toggle" onclick="SwiftCourier.toggleTheme()"><i class="fas fa-moon"></i></button>
      <a href="login.html" class="btn btn-primary">Login</a>
      <div class="hamburger"><i class="fas fa-bars"></i></div>
    </div>
  </nav>

  <!-- Centered Form Wrapper Frame -->
  <div class="login-container">
    <div class="glass login-card">
      <h2>Welcome Back</h2>
      
      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" class="form-control" placeholder="user@swiftcourier.com" required>
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
        </div>

        <div class="form-group">
          <label for="loginRole">Account Role</label>
          <select id="loginRole" class="form-control">
            <option value="customer">Customer</option>
            <option value="agent">Booking/Delivery Agent</option>
            <option value="branch">Branch Manager</option>
            <option value="admin">System Admin</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 10px; padding: 12px;">Sign In</button>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const role = document.getElementById('loginRole').value;

      // Automatically increment customer count in localStorage if customer registers/logs in
      if (role === 'customer') {
        let currentCustCount = parseInt(localStorage.getItem('customersCount')) || 12450;
        localStorage.setItem('customersCount', currentCustCount + 1);
      }

      SwiftCourier.showToast('Login successful! Redirecting...', 'success');
      
      setTimeout(() => {
        if(role === 'admin') window.location.href = 'admin.html';
        else if(role === 'branch') window.location.href = 'branch.html';
        else if(role === 'agent') window.location.href = 'delivery.html';
        else window.location.href = 'customer.html';
      }, 1000);
    });
  </script>
</body>
</html>
