<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SwiftCourier - Employee Directory</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .employee-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
    .employee-card { padding: 20px; text-align: center; position: relative; }
    .avatar-circle { width: 70px; height: 70px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; margin: 0 auto 15px; box-shadow: 0 4px 12px rgba(21, 101, 192, 0.2); }
    .role-tag { font-size: 0.75rem; font-weight: 600; padding: 4px 10px; border-radius: 12px; background: rgba(21, 101, 192, 0.1); color: var(--primary); display: inline-block; margin: 8px 0; }
    .card-actions { display: flex; gap: 8px; justify-content: center; margin-top: 15px; }
    .btn-sm { padding: 4px 10px; font-size: 0.75rem; }
    .btn-outline-danger { border: 1px solid #f44336; color: #f44336; background: transparent; }
    .btn-outline-danger:hover { background: #f44336; color: #fff; }
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.5); display: none; align-items: center; justify-content: center; z-index: 2000; }
    .modal-overlay.active { display: flex; }
    .modal-box { width: 90%; max-width: 500px; padding: 30px; }
  </style>
</head>
<body>

  <!-- Standard Navigation Bar -->
  <nav class="navbar">
    <a href="index.html" class="logo"><i class="fas fa-box-open"></i> SwiftCourier</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="tracking.html">Track Parcel</a></li>
      <li><a href="booking.html">Book Parcel</a></li>
      <li><a href="admin.html" class="active">Dashboards</a></li>
    </ul>
    <div class="nav-btns">
      <button class="theme-toggle" onclick="SwiftCourier.toggleTheme()"><i class="fas fa-moon"></i></button>
      <a href="login.html" class="btn btn-primary">Login</a>
      <div class="hamburger"><i class="fas fa-bars"></i></div>
    </div>
  </nav>

  <div class="dashboard-container">
    <aside class="sidebar glass">
      <a href="admin.html"><i class="fas fa-chart-pie"></i> Overview</a>
      <a href="employee.html" class="active"><i class="fas fa-users"></i> Personnel</a>
      <a href="branch.html"><i class="fas fa-building-flag"></i> Branches</a>
      <a href="login.html"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </aside>

    <main class="main-content">
      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
        <h2>Staff Directory</h2>
        <div style="display: flex; gap: 10px;">
          <input type="text" id="employeeSearch" class="form-control" placeholder="Search staff or role..." style="width: 220px;">
          <button class="btn btn-primary" onclick="openAddModal()"><i class="fas fa-user-plus"></i> Add Staff</button>
        </div>
      </div>

      <div class="employee-grid" id="employeeGrid">
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="employeeModal">
    <div class="modal-box glass">
      <h3>Add New Staff Member</h3>
      <form id="addEmployeeForm" style="margin-top: 15px;">
        <div class="form-group" style="margin-bottom: 10px;">
          <label>Full Name</label>
          <input type="text" id="empName" class="form-control" required placeholder="John Smith">
        </div>
        <div class="form-group" style="margin-bottom: 10px;">
          <label>Role</label>
          <select id="empRole" class="form-control">
            <option value="Delivery Agent">Delivery Agent</option>
            <option value="Booking Agent">Booking Agent</option>
            <option value="Branch Manager">Branch Manager</option>
          </select>
        </div>
        <div class="form-group" style="margin-bottom: 10px;">
          <label>Assigned Branch</label>
          <input type="text" id="empBranch" class="form-control" required placeholder="New York Central Hub">
        </div>
        <div class="form-group" style="margin-bottom: 20px;">
          <label>Phone Number</label>
          <input type="text" id="empPhone" class="form-control" required placeholder="+1 555-0192">
        </div>
        <div style="display: flex; gap: 10px; justify-content: flex-end;">
          <button type="button" class="btn" style="background: #ccc; color: #333;" onclick="closeAddModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Employee</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    let employees = JSON.parse(localStorage.getItem('employees')) || [
      { id: 'EMP-101', name: 'Robert Fox', role: 'Delivery Agent', branch: 'Manhattan Hub', phone: '+1 555-0142', status: 'Active' },
      { id: 'EMP-102', name: 'Sarah Jenkins', role: 'Booking Agent', branch: 'Brooklyn Station', phone: '+1 555-0188', status: 'Active' },
      { id: 'EMP-103', name: 'Michael Chang', role: 'Branch Manager', branch: 'Queens Dispatch', phone: '+1 555-0199', status: 'Active' },
      { id: 'EMP-104', name: 'Elena Rostova', role: 'Delivery Agent', branch: 'Manhattan Hub', phone: '+1 555-0123', status: 'On Leave' }
    ];

    function saveEmployees() {
      localStorage.setItem('employees', JSON.stringify(employees));
    }

    function renderEmployees(filter = '') {
      const grid = document.getElementById('employeeGrid');
      if (!grid) return;

      const filtered = employees.filter(e => 
        e.name.toLowerCase().includes(filter.toLowerCase()) || 
        e.role.toLowerCase().includes(filter.toLowerCase()) ||
        e.branch.toLowerCase().includes(filter.toLowerCase())
      );

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">No personnel records found.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(e => `
        <div class="employee-card glass">
          <div class="avatar-circle"><i class="fas fa-user"></i></div>
          <h4>${e.name}</h4>
          <span class="role-tag">${e.role}</span>
          <p style="font-size:0.85rem; color:var(--text-muted); margin-top:5px;">
            <i class="fas fa-building"></i> ${e.branch}
          </p>
          <p style="font-size:0.85rem; color:var(--text-muted); margin-top:2px;">
            <i class="fas fa-phone"></i> ${e.phone}
          </p>
          <div style="margin-top:10px;">
            <span class="badge ${e.status === 'Active' ? 'delivered' : 'pending'}">${e.status}</span>
          </div>
          <div class="card-actions">
            <button class="btn btn-sm btn-secondary" onclick="toggleStatus('${e.id}')">Toggle Status</button>
            <button class="btn btn-sm btn-outline-danger" onclick="deleteEmployee('${e.id}')"><i class="fas fa-trash"></i></button>
          </div>
        </div>
      `).join('');
    }

    function toggleStatus(id) {
      const idx = employees.findIndex(e => e.id === id);
      if (idx !== -1) {
        employees[idx].status = employees[idx].status === 'Active' ? 'On Leave' : 'Active';
        saveEmployees();
        renderEmployees(document.getElementById('employeeSearch').value);
        SwiftCourier.showToast(`Updated status for ${employees[idx].name}`, 'info');
      }
    }

    function deleteEmployee(id) {
      employees = employees.filter(e => e.id !== id);
      saveEmployees();
      renderEmployees(document.getElementById('employeeSearch').value);
      SwiftCourier.showToast(`Employee record removed`, 'success');
    }

    function openAddModal() {
      document.getElementById('employeeModal').classList.add('active');
    }

    function closeAddModal() {
      document.getElementById('employeeModal').classList.remove('active');
    }

    document.getElementById('addEmployeeForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const newEmp = {
        id: 'EMP-' + Math.floor(100 + Math.random() * 900),
        name: document.getElementById('empName').value,
        role: document.getElementById('empRole').value,
        branch: document.getElementById('empBranch').value,
        phone: document.getElementById('empPhone').value,
        status: 'Active'
      };

      employees.push(newEmp);
      saveEmployees();
      renderEmployees();
      closeAddModal();
      e.target.reset();
      SwiftCourier.showToast(`Added ${newEmp.name} to personnel system`, 'success');
    });

    document.getElementById('employeeSearch').addEventListener('input', (e) => {
      renderEmployees(e.target.value);
    });

    document.addEventListener('DOMContentLoaded', () => renderEmployees());
  </script>
</body>
</html>
