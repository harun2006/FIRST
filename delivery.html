<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SwiftCourier - Delivery & Booking Agent Desk</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .agent-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
    .action-btns { display: flex; gap: 6px; flex-wrap: wrap; }
    .btn-sm { padding: 4px 10px; font-size: 0.75rem; }
    .btn-success { background: linear-gradient(135deg, #4CAF50, #2E7D32); color: white; }
    .btn-warning { background: linear-gradient(135deg, #FF9800, #F57C00); color: white; }
    .btn-danger { background: linear-gradient(135deg, #F44336, #D32F2F); color: white; }
    @media (max-width: 992px) { .agent-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <!-- Standard Navigation Bar -->
  <nav class="navbar">
    <a href="index.html" class="logo"><i class="fas fa-box-open"></i> SwiftCourier</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="tracking.html">Track Parcel</a></li>
      <li><a href="booking.html">Book Parcel</a></li>
      <li><a href="admin.html" class="active">Dashboards</a></li>
    </ul>
    <div class="nav-btns">
      <button class="theme-toggle" onclick="SwiftCourier.toggleTheme()"><i class="fas fa-moon"></i></button>
      <a href="login.html" class="btn btn-primary">Login</a>
      <div class="hamburger"><i class="fas fa-bars"></i></div>
    </div>
  </nav>

  <div class="dashboard-container">
    <aside class="sidebar glass">
      <a href="delivery.html" class="active"><i class="fas fa-truck-ramp-box"></i> Operations Desk</a>
      <a href="booking.html"><i class="fas fa-plus-circle"></i> Counter Booking</a>
      <a href="login.html"><i class="fas fa-sign-out-alt"></i> Sign Out</a>
    </aside>

    <main class="main-content">
      <div class="stats-grid">
        <div class="stat-card glass">
          <div class="stat-icon"><i class="fas fa-truck"></i></div>
          <div class="stat-info"><h3 id="statOutForDelivery">0</h3><p>Out for Delivery</p></div>
        </div>
        <div class="stat-card glass">
          <div class="stat-icon"><i class="fas fa-circle-check"></i></div>
          <div class="stat-info"><h3 id="statDelivered">0</h3><p>Delivered Today</p></div>
        </div>
        <div class="stat-card glass">
          <div class="stat-icon"><i class="fas fa-clock"></i></div>
          <div class="stat-info"><h3 id="statPending">0</h3><p>Pending Dispatch</p></div>
        </div>
      </div>

      <div class="agent-grid">
        <div class="glass" style="padding: 20px;">
          <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 15px;">
            <h3>Assigned Packages</h3>
            <input type="text" id="agentSearch" class="form-control" placeholder="Search ID or Customer..." style="width: 220px; padding: 6px 12px;">
          </div>

          <div class="table-responsive">
            <table class="custom-table">
              <thead>
                <tr>
                  <th>Tracking ID</th>
                  <th>Recipient</th>
                  <th>Address</th>
                  <th>Status</th>
                  <th>Update Action</th>
                </tr>
              </thead>
              <tbody id="agentParcelsTable">
              </tbody>
            </table>
          </div>
        </div>

        <div class="glass" style="padding: 20px;">
          <h3 style="margin-bottom: 15px;"><i class="fas fa-calculator"></i> Quick Counter Booking</h3>
          <form id="agentQuickBooking">
            <div class="form-group" style="margin-bottom: 10px;">
              <label>Sender</label>
              <input type="text" id="quickSender" class="form-control" placeholder="Sender Name" required>
            </div>
            <div class="form-group" style="margin-bottom: 10px;">
              <label>Receiver</label>
              <input type="text" id="quickReceiver" class="form-control" placeholder="Receiver Name" required>
            </div>
            <div class="form-group" style="margin-bottom: 10px;">
              <label>Destination Address</label>
              <input type="text" id="quickAddress" class="form-control" placeholder="Full Address" required>
            </div>
            <div class="form-group" style="margin-bottom: 15px;">
              <label>Weight (kg)</label>
              <input type="number" id="quickWeight" step="0.5" class="form-control" value="1.0" min="0.1" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">
              <i class="fas fa-barcode"></i> Book & Generate Label
            </button>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script src="js/app.js"></script>
  <script>
    function updateAgentStats() {
      const out = SwiftCourier.parcels.filter(p => p.status === 'Out For Delivery').length;
      const delivered = SwiftCourier.parcels.filter(p => p.status === 'Delivered').length;
      const pending = SwiftCourier.parcels.filter(p => p.status === 'Booked' || p.status === 'Sorted').length;

      document.getElementById('statOutForDelivery').innerText = out;
      document.getElementById('statDelivered').innerText = delivered;
      document.getElementById('statPending').innerText = pending;
    }

    function renderAgentTable(filter = '') {
      const tableBody = document.getElementById('agentParcelsTable');
      if (!tableBody) return;

      const filteredParcels = SwiftCourier.parcels.filter(p => 
        p.id.toLowerCase().includes(filter.toLowerCase()) || 
        p.receiver.toLowerCase().includes(filter.toLowerCase())
      );

      if (filteredParcels.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="5" style="text-align:center; color: var(--text-muted); padding:20px;">No parcels assigned.</td></tr>`;
        return;
      }

      tableBody.innerHTML = filteredParcels.map(p => {
        const isDelivered = p.status === 'Delivered';
        const isCancelled = p.status === 'Cancelled';

        let badgeClass = 'transit';
        if (isDelivered) badgeClass = 'delivered';
        if (isCancelled) badgeClass = 'cancelled';

        return `
          <tr>
            <td><strong>${p.id}</strong></td>
            <td>${p.receiver}</td>
            <td><small>${p.address}</small></td>
            <td><span class="badge ${badgeClass}">${p.status}</span></td>
            <td>
              <div class="action-btns">
                ${!isDelivered && !isCancelled ? `
                  <button class="btn btn-warning btn-sm" onclick="changeStatus('${p.id}', 'Out For Delivery')">Dispatched</button>
                  <button class="btn btn-success btn-sm" onclick="changeStatus('${p.id}', 'Delivered')"><i class="fas fa-check"></i> Delivered</button>
                  <button class="btn btn-danger btn-sm" onclick="changeStatus('${p.id}', 'Failed Attempt')">Failed</button>
                ` : `<span style="color:var(--text-muted); font-size:0.8rem;">Complete</span>`}
              </div>
            </td>
          </tr>
        `;
      }).join('');

      updateAgentStats();
    }

    function changeStatus(trackingId, newStatus) {
      const idx = SwiftCourier.parcels.findIndex(p => p.id === trackingId);
      if (idx !== -1) {
        SwiftCourier.parcels[idx].status = newStatus;
        if (!SwiftCourier.parcels[idx].history.includes(newStatus)) {
          SwiftCourier.parcels[idx].history.push(newStatus);
        }
        if (newStatus === 'Delivered') {
          SwiftCourier.parcels[idx].currentLoc = 'Delivered to Recipient';
        } else if (newStatus === 'Out For Delivery') {
          SwiftCourier.parcels[idx].currentLoc = 'With Delivery Courier';
        }
        
        localStorage.setItem('parcels', JSON.stringify(SwiftCourier.parcels));
        SwiftCourier.showToast(`Updated ${trackingId} status to "${newStatus}"`, 'success');
        renderAgentTable(document.getElementById('agentSearch').value);
      }
    }

    document.getElementById('agentQuickBooking').addEventListener('submit', (e) => {
      e.preventDefault();
      const trackingId = 'TRK-' + Math.floor(10000 + Math.random() * 90000);
      const weight = parseFloat(document.getElementById('quickWeight').value) || 1.0;
      
      const newParcel = {
        id: trackingId,
        sender: document.getElementById('quickSender').value,
        receiver: document.getElementById('quickReceiver').value,
        address: document.getElementById('quickAddress').value,
        type: 'Express Parcel',
        weight: weight,
        cost: (10 + weight * 4),
        status: 'Out For Delivery',
        currentLoc: 'Dispatched from Agent Counter',
        estDelivery: new Date().toISOString().split('T')[0],
        history: ['Booked', 'Collected', 'Out For Delivery']
      };

      SwiftCourier.parcels.push(newParcel);
      localStorage.setItem('parcels', JSON.stringify(SwiftCourier.parcels));
      SwiftCourier.showToast(`Order Booked & Dispatched: ${trackingId}`, 'success');
      
      e.target.reset();
      renderAgentTable();
    });

    document.getElementById('agentSearch').addEventListener('input', (e) => {
      renderAgentTable(e.target.value);
    });

    document.addEventListener('DOMContentLoaded', () => {
      renderAgentTable();
    });
  </script>
</body>
</html>
