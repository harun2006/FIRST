<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SwiftCourier - Book Parcel</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="logo"><i class="fas fa-box-open"></i> SwiftCourier</a>
    <a href="customer.html" class="btn btn-secondary">Dashboard</a>
  </nav>

  <div class="form-card glass">
    <h2 style="margin-bottom: 20px;"><i class="fas fa-box"></i> Book New Parcel</h2>

    <form id="bookingForm" class="form-grid">
      <div class="form-group">
        <label>Sender Full Name</label>
        <input type="text" id="senderName" class="form-control" required placeholder="John Doe">
      </div>

      <div class="form-group">
        <label>Receiver Full Name</label>
        <input type="text" id="receiverName" class="form-control" required placeholder="Jane Smith">
      </div>

      <div class="form-group full-width">
        <label>Delivery Address</label>
        <input type="text" id="receiverAddress" class="form-control" required placeholder="123 Main Street, City, Zip">
      </div>

      <div class="form-group">
        <label>Parcel Classification</label>
        <select id="parcelType" class="form-control">
          <option value="Document">Document</option>
          <option value="Standard Package">Standard Package</option>
          <option value="Fragile Item">Fragile Item</option>
          <option value="Heavy Freight">Heavy Freight</option>
        </select>
      </div>

      <div class="form-group">
        <label>Weight (kg)</label>
        <input type="number" id="weight" step="0.1" class="form-control" value="1.0" min="0.1">
      </div>

      <div class="form-group">
        <label>Delivery Speed Option</label>
        <select id="speed" class="form-control">
          <option value="standard">Standard (3-5 Days)</option>
          <option value="express">Express (1-2 Days)</option>
          <option value="overnight">Overnight Priority</option>
        </select>
      </div>

      <div class="form-group">
        <label>Est. Delivery Fee</label>
        <div id="totalCost" style="font-size: 1.5rem; font-weight: 700; color: var(--secondary);"> $14.00</div>
      </div>

      <div class="form-group full-width">
        <button type="submit" class="btn btn-primary" style="justify-content: center;">Confirm Order & Pay</button>
      </div>
    </form>
  </div>

  <script src="js/app.js"></script>
  <script src="js/booking.js"></script>
</body>
</html>
